# ============================================================================
# slam_toolbox_params.yaml —— navbot 专用建图参数
# ============================================================================
# slam_toolbox = 2D 激光 Graph-SLAM：
#   前端：把每帧激光和「当前已知地图」做匹配，算出相对位姿（scan matching）
#   后端：把关键帧连成图，检测回环（loop closure），全局优化
#   输出：/map 话题 + map→odom 变换（★★ 建图模式下它独占这个变换）
#
# 官方原件：/opt/ros/humble/share/slam_toolbox/config/mapper_params_online_async.yaml
# ★ 强烈建议装完后 diff 一遍，下面标 ★ 的都是针对 navbot 改过的
# ============================================================================
slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # ---------------------------------------------------------------------
    # 坐标系：★ 建图模式下没有 map 的初始来源，map 由 slam_toolbox 自己创建
    # ---------------------------------------------------------------------
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # ★ 建图时不需要给初始位姿（不知道自己在哪才开始建）
    #   导航（AMCL）时相反，必须给 → 这是两种模式的一个关键区别
    mode: mapping

    # ---------------------------------------------------------------------
    # 精度与性能
    # ---------------------------------------------------------------------
    resolution: 0.05          # 地图分辨率 5cm/格。★ 和 Nav2 的 costmap resolution 保持一致
    max_laser_range: 12.0     # ★ 必须 ≤ 雷达实际量程（本模型 12.0m）
    minimum_time_interval: 0.5  # ★ 最快每 0.5s 处理一帧激光
    #   ★ 这个值决定 CPU 负担。车走得慢可以设 0.5；走得快必须调小(0.2)，
    #     否则两帧之间位移太大，匹配会失败 → 地图糊成一团

    transform_timeout: 0.2
    tf_buffer_duration: 30.0  # ★ TF 缓存时长。设太小会在车快时丢变换
    stack_size_to_use: 40000000
    enable_interactive_mode: true   # ★ 允许在 RViz 里手动拉回环（调试神器）

    # ---------------------------------------------------------------------
    # ★★ 扫描匹配器：slam 的「眼睛」，选错等于白建
    #   CSM (Correlative Scan Matcher)  —— 暴力搜索，慢但最容易建出图
    #   Karto                            —— 更精确，但对参数敏感
    #   ★ 入门用 CSM。等你能建出图了，再换 Karto 对比「精度 vs 速度」
    # ---------------------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---------------------------------------------------------------------
    # 激光使用范围
    # ---------------------------------------------------------------------
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3   # ★ 走 30cm 才插一个关键帧
    #   ★ 调小 → 关键帧密、图更精细但更卡；调大 → 稀疏、容易丢回环
    minimum_travel_heading: 0.3    # ★ 转 0.3rad(约17°) 才插关键帧
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0   # ★ 回环检测的搜索半径
    do_loop_closing: true               # ★★ 关掉它 = 放弃 Graph-SLAM 的核心优势
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---------------------------------------------------------------------
    # 相关性搜索（CSM 的核心参数）
    # ★ 这一组的含义：在「估计位姿附近多大范围、以多大步长」搜索最优匹配
    #   范围太小 → 车走快了就匹配不上
    #   范围太大 → 慢且容易被错误的匹配骗走
    # ---------------------------------------------------------------------
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # 回环检测的搜索范围（比上面大，因为回环本来就跨度大）
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ---------------------------------------------------------------------
    # 距离方差 —— 告诉优化器「我对自己算出的位姿有多自信」
    # ★ 设太自信（小）→ 一次错匹配就把整张图带歪
    #   设太不自信（大）→ 优化器不敢调，回环不生效
    # ---------------------------------------------------------------------
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    # 精细匹配的搜索参数
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
